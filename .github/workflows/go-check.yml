name: Go Check

on:
  workflow_call:
    inputs:
      runs-on:
        default: ubuntu-latest
        required: false
        type: string
      command-test:
        required: true
        type: string
      setup-go:
        required: false
        type: boolean
        default: true
        description: Indicate whether should install go or not. Default is true
      gomod-path:
        required: false
        type: string
        default: "go.mod"
        description: Indicate the path of go.mod file. Default is go.mod
      cache-dependency-path:
        required: false
        type: string
        default: "go.sum"
        description: >-
          Path or glob passed to setup-go's cache-dependency-path. Multi-module
          monorepos (no root go.sum) should pass '**/go.sum'. Default is go.sum.
      lint:
        required: false
        type: boolean
        default: false
        description: Indicate whether should run golint or not. Default is false
      lint-path:
        required: false
        type: string
        default: ".golangci.yml"
        description: Indicate the path of lint config file. Default is .golangci.yml
      lint-timeout:
        required: false
        type: string
        default: 10m
        description: Indicate the timeout of golangci-lint. Default is 10 minutes
      policy-lint:
        required: false
        type: boolean
        default: false
        description: >-
          Also run the fleet lint policy (.github/lint/golangci-policy.yml from
          this repository at the pinned SHA) as a second golangci-lint pass —
          RFC-0031 / ADR-072 shared-package rule. The caller's own config is
          untouched. Default is false.
      policy-lint-blocking:
        required: false
        type: boolean
        default: false
        description: >-
          Fail the Lint job on a policy finding. Default is false (findings are
          reported, the job stays green) for the first release train of a
          policy change; flip to true afterwards.
      lint-version:
        required: false
        type: string
        default: "v2.12.2"
        description: >-
          Fallback golangci-lint version, used only when the caller has no
          tools/go.mod. Prefer pinning the linter there so Dependabot keeps it
          current and local matches CI. Uses go install for act/Go compatibility.
      test-stable:
        required: false
        type: boolean
        default: false
        description: Also test against stable Go version (non-blocking, for compatibility check)
      integration:
        required: false
        type: boolean
        default: false
        description: Run integration tests (go test -tags=integration). Needs a Docker daemon (testcontainers); ubuntu-latest has one.
      integration-command:
        required: false
        type: string
        default: 'go test -tags=integration -covermode=atomic -coverprofile=coverage-integration.out ./...'
        description: Command for the integration job. Must write coverage-integration.out (merged into SonarCloud coverage).


jobs:
  test:
    name: Test
    timeout-minutes: 60
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ inputs.setup-go }}
        with:
          go-version-file: ${{ inputs.gomod-path }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Show Go version
        run: go version

      # Ryuk is disabled for any testcontainers-based tests the command runs:
      # the runner is ephemeral (no orphans to clean) and Ryuk's connect step
      # intermittently hangs on GitHub runners. Harmless when the command
      # doesn't use testcontainers.
      - name: Unit Test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ${{ inputs.command-test }}

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 1

      - name: Coverage Report Summary
        if: success()
        uses: duynhlab/gha-workflows/.github/actions/coverage-summary@main
        with:
          coverage-file: coverage.out
          title: Unit Test Coverage
          artifact-name: coverage-report

  integration:
    name: Integration Test
    if: ${{ inputs.integration }}
    timeout-minutes: 30
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ inputs.setup-go }}
        with:
          go-version-file: ${{ inputs.gomod-path }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      # ubuntu-latest ships a running Docker daemon, so testcontainers works.
      - name: Integration Test
        # Disable the testcontainers Ryuk reaper on CI: the runner is ephemeral
        # (no orphans to clean), and Ryuk's connect step intermittently hangs on
        # GitHub runners — which timed out the whole job. Containers are still
        # torn down by each test's t.Cleanup.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ${{ inputs.integration-command }}

      - name: Archive integration coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: coverage-integration-report
          path: coverage-integration.out
          retention-days: 1

      - name: Coverage Report Summary
        if: success()
        uses: duynhlab/gha-workflows/.github/actions/coverage-summary@main
        with:
          coverage-file: coverage-integration.out
          title: Integration Test Coverage
          artifact-name: coverage-integration-report

  test-stable:
    name: Test (stable)
    if: ${{ inputs.test-stable }}
    timeout-minutes: 60
    runs-on: ${{ inputs.runs-on }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go (stable)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ inputs.setup-go }}
        with:
          go-version: 'stable'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Show Go version
        run: go version

      - name: Unit Test
        run: ${{ inputs.command-test }}

  # Run lint
  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ${{ inputs.runs-on }}
    if: github.event_name == 'pull_request' && inputs.lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.gomod-path }}
          cache: false

      # fix typecheck fails https://github.com/golangci/golangci-lint-action/issues/902
      - name: Download dependencies
        run: |
          go mod download

      # A repository that pins golangci-lint in tools/go.mod (Go 1.24 `tool`
      # directive) gets that exact version, built from the same module a
      # developer builds from locally. That is the only arrangement where CI and
      # the workstation cannot drift: `lint-version` is a plain string input, so
      # nothing updates it — which is how the default sat on v2.6.0 while every
      # local install had moved on, and 63 findings never reached CI.
      #
      # Dependabot's gomod ecosystem does update tools/go.mod, per repository, in
      # that repository's own PR. Repos without tools/go.mod keep the old path.
      - name: Install golangci-lint
        run: |
          if [ -f tools/go.mod ]; then
            echo "::notice::golangci-lint pinned by tools/go.mod"
            go -C tools build -o "$RUNNER_TEMP/golangci-lint" \
              github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          else
            echo "::notice::golangci-lint from lint-version input (${{ inputs.lint-version }}) — consider pinning it in tools/go.mod"
            GOBIN="$RUNNER_TEMP" go install \
              github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ inputs.lint-version }}
          fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint check
        # Print the version first: a silent version drift between CI and the
        # workstation is the failure this job is meant to make impossible.
        run: |
          golangci-lint --version
          golangci-lint run --timeout="${{ inputs.lint-timeout }}" --config="${{ inputs.lint-path }}"

      # Fleet lint policy (RFC-0031 / ADR-072): a second, additive pass with the
      # policy file from THIS repository at the SHA the caller pinned, so a
      # policy change ships the way every other workflow change ships — a
      # Dependabot bump of the workflow ref. golangci-lint has no config
      # inheritance or remote include; a checked-out file passed by --config is
      # the mechanism. job.workflow_sha is "the commit SHA of the workflow file
      # that defines the current job" — for a job defined in a reusable workflow,
      # the reusable workflow file's commit, i.e. exactly the pin the caller chose.
      # (github.workflow_sha is NOT that: inside a reusable workflow it resolves to
      # the CALLER's commit, and the first rollout failed with `upload-pack: not
      # our ref <caller sha>` on every service.)
      - name: Checkout fleet lint policy
        if: ${{ inputs.policy-lint }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: duynhlab/gha-workflows
          ref: ${{ job.workflow_sha }}
          path: .gha-policy
          sparse-checkout: .github/lint
          sparse-checkout-cone-mode: false
      - name: Fleet lint policy
        if: ${{ inputs.policy-lint }}
        continue-on-error: ${{ !inputs.policy-lint-blocking }}
        run: |
          echo "::notice::fleet lint policy from duynhlab/gha-workflows@${{ job.workflow_sha }} (blocking: ${{ inputs.policy-lint-blocking }})"
          golangci-lint run --timeout="${{ inputs.lint-timeout }}" --config=.gha-policy/.github/lint/golangci-policy.yml