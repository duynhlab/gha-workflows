name: CodeQL

# Reusable workflow: runs ONE CodeQL analysis for ONE language.
#
# Call it once per language so each analysis gets its own SARIF category and the
# results don't overwrite each other in the Security tab:
#
#   go      -> compiled language      -> build-mode: autobuild (or manual)
#   actions -> configuration language -> build-mode: none
#
# Note: a green CodeQL job does NOT mean the repo has no alerts. Alert severity
# must be enforced with GitHub Code Scanning merge protection (Ruleset).

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      language:
        description: 'CodeQL language to analyze (e.g. go, actions)'
        required: true
        type: string
      build-mode:
        description: 'CodeQL build mode: autobuild, none, or manual'
        required: true
        type: string
      queries:
        description: 'Query suite to run (e.g. security-extended, security-and-quality)'
        required: false
        type: string
        default: 'security-extended'
      go-version-file:
        description: 'Path to go.mod, used to pick the Go version (language: go only)'
        required: false
        type: string
        default: 'go.mod'
      manual-build-command:
        description: 'Build command to run, required when build-mode is "manual"'
        required: false
        type: string
        default: ''

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Match the service's own Go version: CodeQL extraction depends on the
      # toolchain that actually builds the code.
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}

      # Only for build-mode: manual. With build-mode: autobuild the init action
      # already handles the build, so no separate autobuild step is needed.
      - name: Manual build
        if: inputs.build-mode == 'manual'
        env:
          BUILD_COMMAND: ${{ inputs.manual-build-command }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BUILD_COMMAND" ]; then
            echo "::error::build-mode is 'manual' but manual-build-command is empty."
            exit 1
          fi
          bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Analyze
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: /language:${{ inputs.language }}
